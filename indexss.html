<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Password Lock</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="screen active">
        <div class="split-layout">
            <div class="left-side">
                <img class="avatar-img" src="./media/image_wlK7az.png" alt="Couple hugging">
                <div class="cloud-base"></div>
            </div>
            <div class="keypad-container" id="lock-module">
                <div class="lock-title">Guess the<br>password</div>
                <div class="slots-row" id="slots-wrapper">
                    <div class="slot" id="slot-0"></div>
                    <div class="slot" id="slot-1"></div>
                    <div class="slot" id="slot-2"></div>
                    <div class="slot" id="slot-3"></div>
                </div>
                <div class="grid-keypad">
                    <div class="key-heart" onclick="pressKey('1')"><span class="key-text">1</span></div>
                    <div class="key-heart" onclick="pressKey('2')"><span class="key-text">2</span></div>
                    <div class="key-heart" onclick="pressKey('3')"><span class="key-text">3</span></div>
                    <div class="key-heart" onclick="pressKey('4')"><span class="key-text">4</span></div>
                    <div class="key-heart" onclick="pressKey('5')"><span class="key-text">5</span></div>
                    <div class="key-heart" onclick="pressKey('6')"><span class="key-text">6</span></div>
                    <div class="key-heart" onclick="pressKey('7')"><span class="key-text">7</span></div>
                    <div class="key-heart" onclick="pressKey('8')"><span class="key-text">8</span></div>
                    <div class="key-heart" onclick="pressKey('9')"><span class="key-text">9</span></div>
                    <div class="key-heart" onclick="clearKeys()"><span class="key-text">*</span></div>
                    <div class="key-heart" onclick="pressKey('0')"><span class="key-text">0</span></div>
                    <div class="key-heart" onclick="clearKeys()"><span class="key-text">#</span></div>
                </div>
                <div>
                    <div class="nav-arrow" onclick="window.location.href='tit.html'">
                        <div class="pixel-arrow-icon"></div>

                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
