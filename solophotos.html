<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ilove you <style 
  font-family: sans-serif;
  font-size: 1.1rem;
  font-weight: bold;c  ;></style></title>
    <style>
        /* Base Reset & Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        h1{
            font-family: 'cursive', sans-serif;
        }
        :root {
            --pink: #FFD1DC;
            --black: #1A1A1A;
            --white: #FFFFFF;
            --gray: #F9F9F9;
        }
        body {
            font-family: 'cursive', sans-serif;
            background-color: var(--white);
            color: var(--black);
            line-height: 1.6;
        }

        /* Header Section */
        header {
            background-color: var(--pink);
            padding: 4rem 2rem;
            text-align: center;
            border-bottom: 5px solid var(--black);
        }
        header h1 {
            font-size: 3rem;
            color: var(--black);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }
        header p {
            font-size: 1.2rem;
            color: var(--black);
            font-style: italic;
        }

        /* Gallery Container */
        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
        }

        /* Grid Layout */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        /* Photo Cards */
        .photo-card {
            background-color: var(--white);
            border: 3px solid var(--pink);
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 5px 5px 0px var(--pink);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .photo-card:hover {
            transform: translate(-4px, -4px);
            box-shadow: 9px 6px 0px var(--black);
        }
        .photo-wrapper {
            position: relative;
            width: 100%;
            padding-top: 100%; /* 1:1 Aspect Ratio */
            background-color: var(--gray);
            border-bottom: 3px solid var(--black);
        }
        .photo-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .photo-info {
            padding: 1rem;
            background-color: var(--white);
        }
        .photo-info h3 {
            font-size: 1.1rem;
            margin-bottom: 0.25rem;
        }
        .photo-info p {
            font-size: 0.9rem;
            color: #666;
        }

        /* Footer */
        footer {
            background-color: var(--pink);
            color: var(--white);
            text-align: center;
            padding: 2rem;
            margin-top: 4rem;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
        footer span {
            color: var(--pink);
        }
    </style>
</head>
<body>


    <!-- Main Content -->
    <main class="gallery-container">
        <div class="photo-grid">
            
            <!-- Photo 1 -->
            <div class="photo-card">
                <div class="photo-wrapper">
                    <!-- Replace with your image link -->
                    <img src="media1.jpeg" alt="Celebrant Photo">
                </div>
                <div class="photo-info">
                    <h3></h3>
                    <p>A beautiful day to remember.</p>
                </div>
            </div>

            <!-- Photo 2 -->
            <div class="photo-card">
                <div class="photo-wrapper">
                    <img src="media4.jpeg" alt="Celebrant Photo">
                </div>
                <div class="photo-info">
                    <h3></h3>
                    <p>Wishing you longlife and prosperity.</p>
                </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="nav-arrow" onclick="window.location.href='enjoy.html'">
                    <div class="pixel-arrow-icon" style="transform: rotate(180deg);">
                    </div>
        <p>Made with <span>♥</span> for you😘</p>
    </footer>

</body>
</html>
